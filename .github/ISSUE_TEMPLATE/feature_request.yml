name: 改进建议
description: 描述具体任务、困难与希望改进的行为
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 当前任务与困难
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 希望得到的行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代办法与补充背景
