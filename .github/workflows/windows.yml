name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: windows-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Protocol, file IO and UI contracts (no native process bridge)
        timeout-minutes: 8
        run: >
          node --test --test-concurrency=2 --test-timeout=120000
          dist/tests/adapter.test.js
          dist/tests/boundaries.test.js
          dist/tests/bounded-context.test.js
          dist/tests/core.test.js
          dist/tests/model-stream.test.js
          dist/tests/repeated-reasoning.test.js
          dist/tests/image-observation.test.js
          dist/tests/architecture.test.js
          dist/tests/office-attachments.test.js
          dist/tests/attachments.test.js
          dist/tests/length-startup.test.js
          dist/tests/reliability-usage.test.js
          dist/tests/cache-and-repeat.test.js
          dist/tests/program-observation.test.js
          dist/tests/process-feedback.test.js
          dist/tests/conversation-deletion.test.js
          dist/tests/deepseek-request.test.js
          dist/tests/file-discovery.test.js
          dist/tests/interaction.test.js
          dist/tests/outputs.test.js
          dist/tests/outputs-ui.test.js
          dist/tests/single-file-resources.test.js
          dist/tests/text-edit.test.js
          dist/tests/text-write.test.js
          dist/tests/tool-modules.test.js
          dist/tests/ui-flow.test.js
          dist/tests/window-chrome.test.js
          dist/tests/web-search.test.js
          dist/tests/web-fetch.test.js
      - run: node scripts/build-desktop.mjs
