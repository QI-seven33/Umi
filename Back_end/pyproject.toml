[project]
name = "back-end"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "agents>=1.4.0",
    "aiosqlite>=0.22.1",
    "apiexception>=0.2.3",
    "deepagents>=0.7.14",
    "deepseek-tokenizer>=0.3.0",
    "fastapi>=0.141.1",
    "ipython>=9.17.1",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "msgpack>=1.2.2",
    "openai-agents[docker]>=0.22.3",
    "platformdirs>=4.4.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "sse-starlette>=3.4.11",
    "uvicorn>=0.52.4",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/umi"]

